<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <defs>
    <style>
      .abstract-box { fill: #e3f2fd; stroke: #1976d2; stroke-width: 2; }
      .concrete-box { fill: #f8f9fa; stroke: #333; stroke-width: 1.5; }
      .container-box { fill: #fff3e0; stroke: #f57c00; stroke-width: 2; }
      .sep { stroke: #999; stroke-width: 1; }
      .conn { stroke: #555; stroke-width: 1.5; fill: none; }
      .title { font-weight: bold; font-size: 14px; }
      .stereotype { font-style: italic; font-size: 11px; fill: #666; }
      .note { font-size: 11px; fill: #666; }
    </style>
    <marker id="inherit" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto">
      <polygon points="0,0 14,7 0,14" fill="white" stroke="#555" stroke-width="1.5"/>
    </marker>
    <marker id="composition" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="14" markerHeight="10" orient="auto">
      <polygon points="0,5 7,0 14,5 7,10" fill="#555" stroke="#555"/>
    </marker>
  </defs>

  <text x="450" y="24" text-anchor="middle" font-size="16" font-weight="bold">Idea 3 — Music Playlist</text>

  <!-- Container: Playlist -->
  <g>
    <rect class="container-box" x="50" y="60" width="300" height="180" rx="4"/>
    <text x="200" y="84" text-anchor="middle" class="title">Playlist</text>
    <line class="sep" x1="50" y1="94" x2="350" y2="94"/>
    <text x="62" y="116">- items: ArrayList&lt;MusicItem&gt;</text>
    <line class="sep" x1="50" y1="128" x2="350" y2="128"/>
    <text x="62" y="150">+ add(MusicItem): void</text>
    <text x="62" y="170">+ remove(String): void</text>
    <text x="74" y="186" class="note">throws ItemNotFoundException</text>
    <text x="62" y="206">+ totalDuration(): int</text>
    <text x="62" y="226">+ getAll(): List&lt;MusicItem&gt;</text>
  </g>

  <!-- Abstract: MusicItem -->
  <g>
    <rect class="abstract-box" x="500" y="40" width="300" height="220" rx="4"/>
    <text x="650" y="66" text-anchor="middle" class="stereotype">«abstract»</text>
    <text x="650" y="86" text-anchor="middle" class="title">MusicItem</text>
    <line class="sep" x1="500" y1="98" x2="800" y2="98"/>
    <text x="512" y="120">- title: String</text>
    <text x="512" y="140">- artist: String</text>
    <line class="sep" x1="500" y1="152" x2="800" y2="152"/>
    <text x="512" y="174">+ getTitle() / setTitle(...)</text>
    <text x="512" y="194">+ getArtist() / setArtist(...)</text>
    <text x="512" y="218" font-style="italic">+ getDuration(): int</text>
    <text x="524" y="234" class="note">«abstract» — minutes</text>
  </g>

  <!-- Subclass: Song -->
  <g>
    <rect class="concrete-box" x="320" y="360" width="240" height="150" rx="4"/>
    <text x="440" y="384" text-anchor="middle" class="title">Song</text>
    <line class="sep" x1="320" y1="396" x2="560" y2="396"/>
    <text x="332" y="418">- lengthMin: int</text>
    <line class="sep" x1="320" y1="430" x2="560" y2="430"/>
    <text x="332" y="452">+ getLengthMin() / set...</text>
    <text x="332" y="472">+ getDuration(): int</text>
  </g>

  <!-- Subclass: Album -->
  <g>
    <rect class="concrete-box" x="600" y="360" width="240" height="150" rx="4"/>
    <text x="720" y="384" text-anchor="middle" class="title">Album</text>
    <line class="sep" x1="600" y1="396" x2="840" y2="396"/>
    <text x="612" y="418">- trackCount: int</text>
    <text x="612" y="436">- avgTrackMin: int</text>
    <line class="sep" x1="600" y1="448" x2="840" y2="448"/>
    <text x="612" y="468">+ getTrackCount() / set...</text>
    <text x="612" y="488">+ getDuration(): int</text>
  </g>

  <path class="conn" d="M 350 150 L 500 150" marker-start="url(#composition)"/>
  <text x="410" y="142" text-anchor="middle" class="note">holds *</text>

  <path class="conn" d="M 440 360 L 440 310 L 610 310 L 610 260" marker-end="url(#inherit)"/>
  <path class="conn" d="M 720 360 L 720 310 L 690 310 L 690 260" marker-end="url(#inherit)"/>
</svg>
